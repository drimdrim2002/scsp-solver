name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "scikit-build-core>=0.10" "pybind11>=2.12" cmake ninja numpy scipy pytest

      - name: Configure, build, and run C++ tests (-Werror)
        run: |
          cmake -S . -B build-native -G Ninja -DSCSP_BUILD_PYTHON=OFF -DSCSP_BUILD_TESTS=ON -DSCSP_WERROR=ON
          cmake --build build-native -j4
          ctest --test-dir build-native --output-on-failure

      - name: Build Python wheel and verify out-of-tree import
        run: |
          pip wheel . --no-build-isolation --no-deps -w dist-wheels
          pip install --no-cache-dir dist-wheels/scsp-*.whl
          python -c "import os, scsp; os.chdir('/tmp'); print(scsp.version(), '|', scsp.build_info(), '| threads=', scsp.hardware_threads())"

      - name: Run pytest suite
        run: |
          pytest -q tests --ignore=tests/test_ortools.py
